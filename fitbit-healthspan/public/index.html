<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <title>Healthspan for Fitbit</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icon.svg" alt="" width="26" height="26" /> <span>Healthspan</span></div>
    <div class="datepick" id="datepick" hidden>
      <button class="icon-btn" data-action="prev-day" aria-label="Previous day">‹</button>
      <span id="current-date"></span>
      <button class="icon-btn" data-action="next-day" aria-label="Next day">›</button>
    </div>
    <button class="icon-btn" data-action="open-settings" aria-label="Settings and data">⚙</button>
  </header>

  <nav class="tabs" id="tabs" hidden>
    <button data-tab="today" class="active">Today</button>
    <button data-tab="healthspan">Healthspan</button>
    <button data-tab="sleep">Sleep</button>
    <button data-tab="strain">Strain</button>
    <button data-tab="stress">Stress</button>
    <button data-tab="health">Health</button>
    <button data-tab="trends">Trends</button>
    <button data-tab="journal">Journal</button>
    <button data-tab="devices">Fitbit vs WHOOP</button>
  </nav>

  <main id="view" aria-live="polite"></main>

  <dialog id="settings">
    <form method="dialog" class="settings-form" id="settings-form"></form>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
